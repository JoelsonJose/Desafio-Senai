spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:senai_futebol}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ssXXX"
    time-zone: "America/Sao_Paulo"
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

cors:
  origin: ${CORS_ORIGIN:http://localhost:5173}