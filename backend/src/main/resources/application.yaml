spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5433/senai_futebol
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ssXXX"
    time-zone: "America/Sao_Paulo"
    serialization:
      write-dates-as-timestamps: false